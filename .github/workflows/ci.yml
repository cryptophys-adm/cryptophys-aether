name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (canon staleness, card guard, D1 store)
        run: npm test
      - name: Canon bundle is up to date
        run: node scripts/build-canon.mjs --check
      - name: Worker build (dry run, no deploy)
        run: npx --yes wrangler@4.45.0 deploy --dry-run --outdir dist
